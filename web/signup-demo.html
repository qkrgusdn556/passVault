<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PassVault Signup Demo</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#151817;background:#eef3ed}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef3ed,#fbfaf5)}main{width:min(460px,100%);border:1px solid #d8ddd5;border-radius:10px;background:white;padding:24px;box-shadow:0 20px 60px rgba(29,42,35,.14)}h1{margin:0 0 6px;font-size:26px}p{margin:0 0 20px;color:#626a65}form{display:grid;gap:14px}label{display:grid;gap:7px;color:#4a524d;font-size:14px;font-weight:800}input{width:100%;border:1px solid #cfd7ce;border-radius:7px;padding:12px;font:inherit;font-size:16px}button{min-height:44px;border:0;border-radius:7px;background:#267365;color:white;font:inherit;font-weight:900;cursor:pointer}.status{margin-top:16px;min-height:44px;border-radius:7px;background:#f1f5ef;padding:12px;color:#34403a}.hint{margin-top:14px;font-size:13px;line-height:1.5;color:#626a65}
    </style>
  </head>
  <body>
    <main>
      <h1>계정 만들기 테스트</h1>
      <p>GitHub 회원가입처럼 아이디는 직접 입력하고, 비밀번호는 PassVault 추천을 승인하는 흐름입니다.</p>
      <form id="signupForm">
        <label>아이디 또는 이메일<input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com"></label>
        <label>비밀번호<input id="password" name="password" type="password" autocomplete="new-password" placeholder="PassVault 추천 사용"></label>
        <label>비밀번호 확인<input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="자동으로 같이 입력됨"></label>
        <button type="submit">계정 생성</button>
      </form>
      <div id="status" class="status">아이디를 적고 비밀번호 칸을 누르면 PassVault 추천 패널이 뜹니다.</div>
      <div class="hint">승인하면 현재 도메인, 아이디, 비밀번호가 확장 프로그램에 저장됩니다. 그 다음 로그인 데모에서 PIN 인증 후 자동입력할 수 있습니다.</div>
    </main>
    <script>
      document.getElementById("signupForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirm = document.getElementById("confirm").value;
        const status = document.getElementById("status");
        if (!email || !password || password !== confirm) {
          status.textContent = "아이디와 같은 비밀번호 두 칸이 필요합니다.";
          return;
        }
        status.textContent = `${email} 계정 생성 폼 제출 완료. 이제 로그인 페이지에서 자동입력을 테스트하세요.`;
      });
    </script>
  </body>
</html>
